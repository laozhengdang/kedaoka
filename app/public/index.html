<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: file:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>老郑荡的妙妙小工具</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div id="app">
  <!-- 第一栏：工具 -->
  <aside id="toolbar">
    <div class="brand">妙妙小工具</div>
    <div class="side-label">科目</div>
    <div class="tools">
      <div class="tool-block">
        <div class="tool-cap">目前选择</div>
        <select id="profPick" class="tool-select"></select>
      </div>
    </div>
    <div class="side-label">独立计时器</div>
    <div class="tools">
      <button id="btnTimer" class="tool-row">
        <span id="timerText" class="tool-clock">00:00</span>
      </button>
      <div class="tool-hint" id="timerHint">点一下开始 · 右键清零</div>
    </div>
    <div class="side-label">主题</div>
    <div class="tools">
      <select id="themePick" class="tool-select">
        <option value="paper">纸白</option>
        <option value="warm">米黄</option>
        <option value="dark">夜间</option>
        <option value="custom">自定义…</option>
      </select>
      <div class="tool-hint" id="themeHint">选「自定义」可以调色和换背景图</div>
    </div>
    <div class="side-label">其他小工具</div>
    <div class="tools">
      <div class="tool-hint">尚未开发</div>
    </div>
  </aside>

  <!-- 第二栏：课程 -->
  <aside id="sidebar">
    <div class="side-label">课程</div>
    <div class="courses" id="courseList"></div>
    <div class="side-foot">
      <button id="btnNewCourse" class="ghost">＋ 新建学科</button>
      <button id="btnSettings" class="ghost">设置</button>
      <button id="btnCollapse" class="ghost" title="收起课程栏">«</button>
    </div>
  </aside>

  <main id="main"></main>
</div>

<!-- 新建学科 -->
<div id="newCourseModal" class="modal hidden">
  <div class="modal-box">
    <h3>新建学科</h3>
    <p class="hint">先建一个空学科，再往里导入课件。每个学科的知识库是独立的。</p>
    <input id="newCourseName" placeholder="学科名，例如 兽医免疫学">
    <input id="newCourseProf" placeholder="所属专业（默认 兽医学）">
    <div class="row">
      <button id="newCourseGo" class="primary">创建</button>
      <button id="newCourseClose" class="ghost">取消</button>
    </div>
  </div>
</div>

<!-- 导入课件（在某个学科里） -->
<div id="importModal" class="modal hidden">
  <div class="modal-box">
    <h3 id="importTitle">导入课件</h3>
    <p class="hint">点「选择文件」挑课件，或者直接把文件从微信/文件夹拖进这个窗口。</p>
    <div class="row" style="margin-bottom:8px">
      <button id="importPick" class="small">选择文件…</button>
      <span class="sub" id="importPicked"></span>
    </div>
    <input id="importPath" placeholder="文件路径（选完会自动填）">
    <input id="importCourse" placeholder="学科名">
    <div class="row" style="gap:16px;margin:6px 0 2px">
      <label><input type="radio" name="kind" value="theory" checked> 理论课</label>
      <label><input type="radio" name="kind" value="lab"> 实验课</label>
    </div>
    <div class="row">
      <button id="importGo" class="primary">开始导入</button>
      <button id="importClose" class="ghost">关闭</button>
    </div>
    <pre id="importLog" class="log"></pre>
  </div>
</div>

<!-- 专注计时器：独占全屏 -->
<div id="focusScreen" class="hidden">
  <div class="focus-inner">
    <div class="focus-clock" id="focusClock">00:00</div>
    <div class="focus-msg" id="focusMsg">点「开始」就进入专注</div>
    <div class="focus-btns">
      <button id="focusToggle" class="focus-btn primary">开始</button>
      <button id="focusExit" class="focus-btn">退出专注</button>
    </div>
    <div class="focus-tip">Esc 也能退出 · 满 30 分 / 1 小时 / 2 小时会提醒你</div>
  </div>
</div>

<!-- 自定义主题 -->
<div id="themeModal" class="modal hidden">
  <div class="modal-box" style="width:520px">
    <h3>自定义主题</h3>
    <div class="row" style="align-items:center;gap:10px;margin-bottom:8px">
      <label style="width:90px">背景</label><input type="color" id="cBg" value="#fbfbf9">
      <label style="width:70px;margin-left:10px">卡片</label><input type="color" id="cPanel" value="#ffffff">
    </div>
    <div class="row" style="align-items:center;gap:10px;margin-bottom:8px">
      <label style="width:90px">文字</label><input type="color" id="cInk" value="#1b1b1b">
      <label style="width:70px;margin-left:10px">强调</label><input type="color" id="cAccent" value="#003399">
    </div>
    <div class="row" style="align-items:center;gap:10px;margin-bottom:8px">
      <label style="width:90px">背景图</label>
      <button id="btnBgPick" class="small">选择图片…</button>
      <button id="btnBgClear" class="ghost small">清除</button>
      <span class="sub" id="bgName"></span>
    </div>
    <div class="row" style="margin-top:14px">
      <button id="themeApply" class="primary">应用</button>
      <button id="themeReset" class="ghost">恢复默认</button>
      <button id="themeClose" class="ghost">关闭</button>
    </div>
  </div>
</div>

<script src="./app.js"></script>
</body>
</html>
