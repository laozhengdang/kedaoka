<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: file:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>老郑荡的妙妙小工具</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div id="app">
  <!-- 第一栏：工具 -->
  <aside id="toolbar">
    <div class="brand">妙妙小工具</div>
    <div class="side-label">科目</div>
    <div class="tools">
      <div class="tool-block">
        <div class="tool-cap">目前选择</div>
        <select id="profPick" class="tool-select"></select>
      </div>
    </div>
    <div class="side-label">独立计时器</div>
    <div class="tools">
      <button id="btnTimer" class="tool-row">
        <span id="timerText" class="tool-clock">00:00</span>
      </button>
      <div class="tool-hint" id="timerHint">点一下开始 · 右键清零</div>
    </div>
    <div class="side-label">主题</div>
    <div class="tools">
      <div class="theme-row" id="themeRow">
        <div class="theme-chip paper" data-theme-pick="paper" title="纸白">纸</div>
        <div class="theme-chip warm" data-theme-pick="warm" title="米黄">米</div>
        <div class="theme-chip dark" data-theme-pick="dark" title="夜间">夜</div>
      </div>
    </div>
    <div class="side-label">其他小工具</div>
    <div class="tools">
      <div class="tool-hint">尚未开发</div>
    </div>
  </aside>

  <!-- 第二栏：课程 -->
  <aside id="sidebar">
    <div class="side-label">课程</div>
    <div class="courses" id="courseList"></div>
    <div class="side-foot">
      <button id="btnNewCourse" class="ghost">＋ 新建学科</button>
      <button id="btnSettings" class="ghost">设置</button>
      <button id="btnCollapse" class="ghost" title="收起课程栏">«</button>
    </div>
  </aside>

  <main id="main"></main>
</div>

<!-- 新建学科 -->
<div id="newCourseModal" class="modal hidden">
  <div class="modal-box">
    <h3>新建学科</h3>
    <p class="hint">先建一个空学科，再往里导入课件。每个学科的知识库是独立的。</p>
    <input id="newCourseName" placeholder="学科名，例如 兽医免疫学">
    <input id="newCourseProf" placeholder="所属专业（默认 兽医学）">
    <div class="row">
      <button id="newCourseGo" class="primary">创建</button>
      <button id="newCourseClose" class="ghost">取消</button>
    </div>
  </div>
</div>

<!-- 导入课件（在某个学科里） -->
<div id="importModal" class="modal hidden">
  <div class="modal-box">
    <h3 id="importTitle">导入课件</h3>
    <p class="hint">点「选择文件」挑课件，或者直接把文件从微信/文件夹拖进这个窗口。</p>
    <div class="row" style="margin-bottom:8px">
      <button id="importPick" class="small">选择文件…</button>
      <span class="sub" id="importPicked"></span>
    </div>
    <input id="importPath" placeholder="文件路径（选完会自动填）">
    <input id="importCourse" placeholder="学科名">
    <div class="row" style="gap:16px;margin:6px 0 2px">
      <label><input type="radio" name="kind" value="theory" checked> 理论课</label>
      <label><input type="radio" name="kind" value="lab"> 实验课</label>
    </div>
    <div class="row">
      <button id="importGo" class="primary">开始导入</button>
      <button id="importClose" class="ghost">关闭</button>
    </div>
    <pre id="importLog" class="log"></pre>
  </div>
</div>

<script src="./app.js"></script>
</body>
</html>
